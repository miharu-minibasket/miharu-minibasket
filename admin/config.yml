backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

locale: ja

collections:
  - name: "news"
    label: "お知らせ"
    label_singular: "お知らせ"
    folder: "_news"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{fields.category}}"
    fields:
      - { label: "タイトル", name: "title", widget: "string" }
      - { label: "日付", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - label: "カテゴリ"
        name: "category"
        widget: "select"
        options:
          - { label: "全体", value: "info" }
          - { label: "男子チーム", value: "boys" }
          - { label: "女子チーム", value: "girls" }
          - { label: "募集", value: "recruit" }
      - label: "カテゴリ表示名"
        name: "category_label"
        widget: "select"
        options:
          - { label: "全体", value: "全体" }
          - { label: "男子", value: "男子" }
          - { label: "女子", value: "女子" }
          - { label: "募集", value: "募集" }
      - { label: "本文", name: "body", widget: "markdown" }

  - name: "gallery"
    label: "ギャラリー写真"
    label_singular: "写真"
    folder: "_gallery"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{fields.tag}}-{{uuid}}"
    fields:
      - { label: "タイトル", name: "title", widget: "string" }
      - { label: "日付", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "写真", name: "image", widget: "image" }
      - label: "カテゴリ"
        name: "tag"
        widget: "select"
        options:
          - { label: "大会・イベント", value: "event" }
          - { label: "男子チーム", value: "boys" }
          - { label: "女子チーム", value: "girls" }
          - { label: "練習", value: "practice" }

  - name: "coaches"
    label: "コーチ紹介"
    label_singular: "コーチ"
    folder: "_coaches"
    create: true
    slug: "{{fields.order}}-{{fields.name_en}}"
    fields:
      - { label: "表示順（数字）", name: "order", widget: "number", default: 1 }
      - { label: "名前", name: "name", widget: "string", hint: "例: 山田 太郎" }
      - { label: "名前（英語・ローマ字）", name: "name_en", widget: "string", hint: "例: taro-yamada（スラッグ用）" }
      - { label: "役職", name: "role", widget: "string", hint: "例: 監督 / コーチ / アシスタントコーチ" }
      - { label: "担当チーム", name: "team", widget: "select", options: [{ label: "男女共通", value: "both" }, { label: "男子", value: "boys" }, { label: "女子", value: "girls" }] }
      - { label: "一言メッセージ", name: "message", widget: "text", required: false }
      - { label: "写真", name: "image", widget: "image", required: false }

  - name: "sponsors"
    label: "協賛企業"
    label_singular: "協賛企業"
    folder: "_sponsors"
    create: true
    slug: "{{fields.order}}-{{fields.name_en}}"
    fields:
      - { label: "表示順（数字）", name: "order", widget: "number", default: 1 }
      - { label: "企業名", name: "name", widget: "string" }
      - { label: "企業名（英語・スラッグ用）", name: "name_en", widget: "string" }
      - { label: "ウェブサイトURL", name: "url", widget: "string", required: false }
      - { label: "バナー画像", name: "banner", widget: "image", required: false }
      - { label: "ロゴ画像", name: "logo", widget: "image", required: false }
      - { label: "協賛プラン", name: "plan", widget: "select", options: [{ label: "ゴールド", value: "gold" }, { label: "シルバー", value: "silver" }, { label: "ブロンズ", value: "bronze" }], required: false }

  - name: "schedule"
    label: "年間スケジュール"
    label_singular: "スケジュール"
    folder: "_schedule"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{fields.tag}}"
    fields:
      - { label: "タイトル", name: "title", widget: "string" }
      - { label: "日付", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "日付（表示用）", name: "date_display", widget: "string", hint: "例: 4/5〜6" }
      - { label: "曜日", name: "day", widget: "string", hint: "例: 土・日", required: false }
      - label: "対象"
        name: "tag"
        widget: "select"
        options:
          - { label: "全体", value: "all" }
          - { label: "男子", value: "boys" }
          - { label: "女子", value: "girls" }
          - { label: "大会", value: "event" }
      - { label: "場所・補足", name: "sub", widget: "string", required: false }
      - { label: "月（数字）", name: "month", widget: "number", hint: "4〜12, 1〜3" }
