backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

locale: ja

collections:
  - name: "news"
    label: "お知らせ"
    label_singular: "お知らせ"
    folder: "_news"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "タイトル", name: "title", widget: "string" }
      - { label: "日付", name: "date", widget: "date", format: "YYYY.MM.DD" }
      - label: "カテゴリ"
        name: "category"
        widget: "select"
        options:
          - { label: "全体", value: "info" }
          - { label: "男子チーム", value: "boys" }
          - { label: "女子チーム", value: "girls" }
          - { label: "募集", value: "recruit" }
      - { label: "本文", name: "body", widget: "markdown" }

  - name: "schedule"
    label: "年間スケジュール"
    label_singular: "スケジュール"
    folder: "_schedule"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "タイトル", name: "title", widget: "string" }
      - { label: "日付（表示用）", name: "date_display", widget: "string", hint: "例: 4/5〜6" }
      - { label: "曜日", name: "day", widget: "string", hint: "例: 土・日", required: false }
      - label: "対象"
        name: "tag"
        widget: "select"
        options:
          - { label: "全体", value: "all" }
          - { label: "男子", value: "boys" }
          - { label: "女子", value: "girls" }
          - { label: "大会", value: "event" }
      - { label: "場所・補足", name: "sub", widget: "string", required: false }
      - { label: "月（数字）", name: "month", widget: "number", hint: "4〜12, 1〜3" }

  - name: "gallery"
    label: "ギャラリー写真"
    label_singular: "写真"
    folder: "_gallery"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "タイトル", name: "title", widget: "string" }
      - { label: "写真", name: "image", widget: "image" }
      - label: "カテゴリ"
        name: "tag"
        widget: "select"
        options:
          - { label: "大会・イベント", value: "event" }
          - { label: "男子チーム", value: "boys" }
          - { label: "女子チーム", value: "girls" }
          - { label: "練習", value: "practice" }
