backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

locale: ja

collections:
  - name: "news"
    label: "お知らせ"
    label_singular: "お知らせ"
    folder: "_news"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{fields.category}}"
    fields:
      - { label: "タイトル", name: "title", widget: "string" }
      - { label: "日付", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - label: "カテゴリ"
        name: "category"
        widget: "select"
        options:
          - { label: "全体", value: "info" }
          - { label: "男子チーム", value: "boys" }
          - { label: "女子チーム", value: "girls" }
          - { label: "募集", value: "recruit" }
      - label: "カテゴリ表示名"
        name: "category_label"
        widget: "select"
        options:
          - { label: "全体", value: "全体" }
          - { label: "男子", value: "男子" }
          - { label: "女子", value: "女子" }
          - { label: "募集", value: "募集" }
      - { label: "本文", name: "body", widget: "markdown" }

  - name: "gallery"
    label: "ギャラリー写真"
    label_singular: "写真"
    folder: "_gallery"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{fields.tag}}-{{uuid}}"
    fields:
      - { label: "タイトル", name: "title", widget: "string" }
      - { label: "日付", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "写真", name: "image", widget: "image" }
      - label: "カテゴリ"
        name: "tag"
        widget: "select"
        options:
          - { label: "大会・イベント", value: "event" }
          - { label: "男子チーム", value: "boys" }
          - { label: "女子チーム", value: "girls" }
          - { label: "練習", value: "practice" }

  - name: "coaches"
    label: "コーチ紹介"
    label_singular: "コーチ"
    folder: "_coaches"
    create: true
    slug: "{{fields.order}}-{{fields.name_en}}"
    fields:
      - { label: "表示順（数字）", name: "order", widget: "number", default: 1 }
      - { label: "名前", name: "name", widget: "string", hint: "例: 山田 太郎" }
      - { label: "名前（英語・ローマ字）", name: "name_en", widget: "string", hint: "例: taro-yamada（スラッグ用）" }
      - { label: "役職", name: "role", widget: "string", hint: "例: 監督 / コーチ / アシスタントコーチ" }
      - { label: "担当チーム", name: "team", widget: "select", options: [{ label: "男女共通", value: "both" }, { label: "男子", value: "boys" }, { label: "女子", value: "girls" }] }
      - { label: "一言メッセージ", name: "message", widget: "text", required: false }
      - { label: "写真", name: "image", widget: "image", required: false }

  - name: "sponsors"
    label: "協賛企業"
    label_singular: "協賛企業"
    folder: "_sponsors"
    create: true
    slug: "{{fields.order}}-{{fields.name_en}}"
    fields:
      - { label: "表示順（数字）", name: "order", widget: "number", default: 1 }
      - { label: "企業名", name: "name", widget: "string" }
      - { label: "企業名（英語・スラッグ用）", name: "name_en", widget: "string" }
      - { label: "ウェブサイトURL", name: "url", widget: "string", required: false }
      - { label: "バナー画像", name: "banner", widget: "image", required: false }
      - { label: "ロゴ画像", name: "logo", widget: "image", required: false }
      - { label: "協賛プラン", name: "plan", widget: "select", options: [{ label: "ゴールド", value: "gold" }, { label: "シルバー", value: "silver" }, { label: "ブロンズ", value: "bronze" }], required: false }

  - name: "annual"
    label: "年間活動計画"
    files:
      - name: "annual"
        label: "年間予定の編集"
        file: "_data/annual.yml"
        description: "年間予定ページの内容です。予定を追加・編集・並べ替えできます。"
        fields:
          - { label: "年度の見出し", name: "year_label", widget: "string", hint: "例: 2026年度" }
          - label: "予定の一覧"
            name: "events"
            widget: "list"
            label_singular: "予定"
            summary: "{{fields.date}}　{{fields.title}}"
            fields:
              - label: "月"
                name: "month"
                widget: "select"
                hint: "この予定が入る月を選びます"
                options:
                  - { label: "4月", value: 4 }
                  - { label: "5月", value: 5 }
                  - { label: "6月", value: 6 }
                  - { label: "7月", value: 7 }
                  - { label: "8月", value: 8 }
                  - { label: "9月", value: 9 }
                  - { label: "10月", value: 10 }
                  - { label: "11月", value: 11 }
                  - { label: "12月", value: 12 }
                  - { label: "1月", value: 1 }
                  - { label: "2月", value: 2 }
                  - { label: "3月", value: 3 }
              - { label: "日付", name: "date", widget: "string", hint: "例: 4/5〜6　または　4/12" }
              - { label: "曜日", name: "day", widget: "string", required: false, hint: "例: 土・日（空欄でもOK）" }
              - { label: "予定名", name: "title", widget: "string", hint: "例: 福島県春季ミニバスケットボール選手権大会" }
              - { label: "会場・補足", name: "sub", widget: "string", required: false, hint: "例: 会場：福島市" }
              - label: "種別"
                name: "tag"
                widget: "select"
                options:
                  - { label: "大会", value: "event" }
                  - { label: "男子", value: "boys" }
                  - { label: "女子", value: "girls" }
                  - { label: "全体行事", value: "all" }

  - name: "documents"
    label: "チーム資料"
    label_singular: "資料"
    folder: "_documents"
    create: true
    slug: "{{fields.order}}-{{fields.slug}}"
    fields:
      - { label: "表示順（数字）", name: "order", widget: "number", default: 1 }
      - { label: "スラッグ（英数字・ハイフンのみ）", name: "slug", widget: "string", hint: "例: team-rules、entry-form（ファイル名になります）" }
      - { label: "タイトル", name: "title", widget: "string", hint: "例: スポーツ少年団 規約" }
      - { label: "説明", name: "description", widget: "text", required: false, hint: "資料の内容を簡単に説明してください" }
      - label: "カテゴリ"
        name: "category"
        widget: "select"
        options:
          - { label: "規約・規則", value: "rules" }
          - { label: "申込書類", value: "forms" }
          - { label: "保護者向け", value: "parents" }
          - { label: "その他", value: "other" }
      - { label: "ファイル（PDF等）", name: "file", widget: "file", hint: "PDFファイルをアップロードしてください", required: false }
      - { label: "更新日", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }

  - name: "teams"
    label: "チーム紹介設定"
    files:
      - name: "teams"
        label: "チーム画像・説明"
        file: "_data/teams.yml"
        fields:
          - { label: "ヘッダーロゴ 丸画像", name: "logo_image", widget: "image", required: false, hint: "ヘッダー左の丸いロゴに表示する画像（空欄の場合はバスケボールアイコン）" }
          - { label: "男子チーム 写真", name: "boys_image", widget: "image", hint: "トップページのチーム紹介に表示される写真" }
          - { label: "男子チーム 説明文", name: "boys_desc", widget: "string" }
          - { label: "男子チーム Instagram URL", name: "boys_instagram", widget: "string" }
          - { label: "女子チーム 写真", name: "girls_image", widget: "image", hint: "トップページのチーム紹介に表示される写真" }
          - { label: "女子チーム 説明文", name: "girls_desc", widget: "string" }
          - { label: "女子チーム Instagram URL", name: "girls_instagram", widget: "string" }
